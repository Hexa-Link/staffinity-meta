server {
    listen 80;
    server_name hexalink.app www.hexalink.app staffinity.hexalink.app;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Landing Page (hexalink.app) ---
server {
    listen 443 ssl;
    server_name hexalink.app www.hexalink.app;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/hexalink.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hexalink.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        # Placeholder: No landing container defined yet.
        # Uncomment below when landing service is available
        # proxy_pass http://landing:3000;
        
        default_type text/html;
        return 200 "<h1>HexaLink Landing Page - Coming Soon</h1>";
    }
}

# --- App (staffinity.hexalink.app) ---
server {
    listen 443 ssl;
    server_name staffinity.hexalink.app;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/hexalink.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hexalink.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Personal
    location /api/personal/ {
        rewrite ^/api/personal/(.*) /$1 break;
        proxy_pass http://personal-service:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Recruiting
    location /api/recruiting/ {
        rewrite ^/api/recruiting/(.*) /$1 break;
        proxy_pass http://recruiting-service:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
