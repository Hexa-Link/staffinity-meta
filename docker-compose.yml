services:
  # --- Databases ---
  postgres:
    image: postgres:15-alpine
    container_name: hexalink-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres # Default DB, others created by script
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    networks:
      - hexalink-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -h localhost -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # --- Backends ---
  personal-service:
    image: ghcr.io/hexa-link/staffinity-personal-service:latest
    container_name: hexalink-personal
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5434;Database=personal_db;Username=postgres;Password=${POSTGRES_PASSWORD};
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks:
      - hexalink-net
    restart: always

  recruiting-service:
    image: ghcr.io/hexa-link/staffinity-recruiting-service:latest
    container_name: hexalink-recruiting
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5434/recruiting_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - PERSONAL_SERVICE_URL=http://personal-service:8080
    depends_on:
      postgres:
        condition: service_healthy
      personal-service:
        condition: service_started # No healthcheck on personal-service yet
    ports:
      - "8082:8080"
    networks:
      - hexalink-net
    restart: always

  # --- Frontend ---
  frontend:
    image: ghcr.io/hexa-link/staffinity-frontend:latest
    container_name: hexalink-frontend
    environment:
      - NEXT_PUBLIC_PERSONAL_API_URL=http://personal-service:8081
      - NEXT_PUBLIC_RECRUITING_API_URL=http://recruiting-service:8082
    ports:
      - "80:3000"
    depends_on:
      - personal-service
      - recruiting-service
    networks:
      - hexalink-net
    restart: always

networks:
  hexalink-net:
    driver: bridge

volumes:
  postgres_data:
