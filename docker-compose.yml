services:
  # --- Databases ---
  postgres:
    image: postgres:15-alpine
    container_name: hexalink-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres # Default DB, others created by script
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    networks:
      - hexalink-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -h localhost -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # --- Backends ---
  personal-service:
    image: ghcr.io/hexa-link/staffinity-personal-service:latest
    container_name: hexalink-personal
    environment:
      # Internal connection to postgres is on port 5432
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=personal_db;Username=postgres;Password=${POSTGRES_PASSWORD};
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080" # Expose to internal network only, Nginx will proxy to this
    networks:
      - hexalink-net
    restart: always

  recruiting-service:
    image: ghcr.io/hexa-link/staffinity-recruiting-service:latest
    container_name: hexalink-recruiting
    environment:
      # Internal connection to postgres is on port 5432
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/recruiting_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      # Internal connection to personal-service is on port 8080
      - PERSONAL_SERVICE_URL=http://personal-service:8080
    depends_on:
      postgres:
        condition: service_healthy
      personal-service:
        condition: service_started
    expose:
      - "8080" # Expose to internal network only, Nginx will proxy to this
    networks:
      - hexalink-net
    restart: always

  # --- Frontend (App) ---
  frontend:
    image: ghcr.io/hexa-link/staffinity-frontend:latest
    container_name: hexalink-frontend
    environment:
      # Public APIs are now accessed via the domain/proxy
      - NEXT_PUBLIC_PERSONAL_API_URL=https://staffinity.hexalink.app/api/personal
      - NEXT_PUBLIC_RECRUITING_API_URL=https://staffinity.hexalink.app/api/recruiting
    expose:
      - "3000" # Expose to internal network only
    depends_on:
      - personal-service
      - recruiting-service
    extra_hosts:
      - "staffinity.hexalink.app:host-gateway"
      - "hexalink.app:host-gateway"
    networks:
      - hexalink-net
    restart: always

  # --- Proxy & SSL ---
  nginx:
    image: nginx:1.24-alpine
    container_name: hexalink-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - personal-service
      - recruiting-service
    networks:
      - hexalink-net
    restart: always
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''

  certbot:
    image: certbot/certbot
    container_name: hexalink-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  hexalink-net:
    driver: bridge

volumes:
  postgres_data:
